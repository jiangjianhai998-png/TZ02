name: TZ02 TrendRadar

on:
  workflow_dispatch:
  schedule:
    # 每 30 分钟运行一次。为 DeepSeek 分析和数据持久化预留完整执行窗口。
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: tz02-trendradar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      TZ: Asia/Singapore
      TIMEZONE: Asia/Singapore
      GITHUB_ACTIONS: "true"
      AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'deepseek' }}
      AI_MODEL: ${{ secrets.AI_MODEL || 'deepseek/deepseek-chat' }}
      AI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.AI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.AI_API_KEY }}
      AI_API_BASE: https://api.deepseek.com
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || format('{0};{1}', secrets.TELEGRAM_GROUP_CHAT_ID, secrets.TELEGRAM_CHANNEL_CHAT_ID) }}
      TELEGRAM_PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
      TELEGRAM_MENU_NBA_URL: ${{ secrets.TELEGRAM_MENU_NBA_URL }}
      TELEGRAM_MENU_FOOTBALL_URL: ${{ secrets.TELEGRAM_MENU_FOOTBALL_URL }}
      TELEGRAM_MENU_LIVE_URL: ${{ secrets.TELEGRAM_MENU_LIVE_URL }}
      TELEGRAM_MENU_HIGHLIGHTS_URL: ${{ secrets.TELEGRAM_MENU_HIGHLIGHTS_URL }}
      TELEGRAM_MENU_BACCARAT_URL: ${{ secrets.TELEGRAM_MENU_BACCARAT_URL }}
      TELEGRAM_MENU_POKER_URL: ${{ secrets.TELEGRAM_MENU_POKER_URL }}
      TELEGRAM_MENU_DRAGON_TIGER_URL: ${{ secrets.TELEGRAM_MENU_DRAGON_TIGER_URL }}
      TELEGRAM_MENU_EGAME_URL: ${{ secrets.TELEGRAM_MENU_EGAME_URL }}
      STORAGE_RETENTION_DAYS: "3"
      AI_TIMEOUT: "180"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies from public PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://pypi.org/simple .

      - name: Validate project before run
        run: |
          set -e
          python -m compileall -q trendradar mcp_server
          grep -q "AI原创短评" trendradar/notification/telegram_card.py
          grep -q "_build_inline_keyboard" trendradar/notification/telegram_card.py
          grep -q "百家乐" trendradar/notification/telegram_card.py
          echo "Project validation passed."

      - name: Show schedule status
        run: python -m trendradar --show-schedule

      - name: Run TrendRadar
        run: python -m trendradar

      - name: Persist output cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update trendradar output cache [skip ci]"
            git pull --rebase --autostash || true
            git push || true
          else
            echo "No output cache changes to commit."
          fi
