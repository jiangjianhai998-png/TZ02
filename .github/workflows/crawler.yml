name: TZ02 TrendRadar

on:
  workflow_dispatch:
  schedule:
    # 每 20 分钟运行一次。GitHub Actions 使用 UTC 时间。
    - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: tz02-trendradar
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TZ: Asia/Singapore
      TIMEZONE: Asia/Singapore
      GITHUB_ACTIONS: "true"
      AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'deepseek' }}
      AI_MODEL: ${{ secrets.AI_MODEL || 'deepseek/deepseek-chat' }}
      AI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.AI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.AI_API_KEY }}
      AI_API_BASE: https://api.deepseek.com
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || format('{0};{1}', secrets.TELEGRAM_GROUP_CHAT_ID, secrets.TELEGRAM_CHANNEL_CHAT_ID) }}
      TELEGRAM_PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
      TELEGRAM_MENU_NBA_URL: ${{ secrets.TELEGRAM_MENU_NBA_URL }}
      TELEGRAM_MENU_FOOTBALL_URL: ${{ secrets.TELEGRAM_MENU_FOOTBALL_URL }}
      TELEGRAM_MENU_LIVE_URL: ${{ secrets.TELEGRAM_MENU_LIVE_URL }}
      TELEGRAM_MENU_HIGHLIGHTS_URL: ${{ secrets.TELEGRAM_MENU_HIGHLIGHTS_URL }}
      TELEGRAM_MENU_BACCARAT_URL: ${{ secrets.TELEGRAM_MENU_BACCARAT_URL }}
      TELEGRAM_MENU_POKER_URL: ${{ secrets.TELEGRAM_MENU_POKER_URL }}
      TELEGRAM_MENU_DRAGON_TIGER_URL: ${{ secrets.TELEGRAM_MENU_DRAGON_TIGER_URL }}
      TELEGRAM_MENU_EGAME_URL: ${{ secrets.TELEGRAM_MENU_EGAME_URL }}
      STORAGE_RETENTION_DAYS: "3"
      AI_TIMEOUT: "180"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply TZ02 Telegram layout before install
        run: python scripts/apply_tz02_telegram_layout.py

      - name: Verify TZ02 Telegram layout patch
        run: |
          set -e
          grep -q "AI原创短评" trendradar/notification/senders.py
          grep -q "_format_tz02_public_post" trendradar/notification/senders.py
          grep -q "_build_public_telegram_reply_markup" trendradar/notification/senders.py
          grep -q "百家乐" trendradar/notification/telegram_interactions.py
          grep -q "final-menu worker" trendradar/notification/telegram_interactions.py
          echo "TZ02 Telegram final layout patch verified."

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          # GitHub Actions 不能访问内部 PyPI 镜像锁定地址，强制使用公开 PyPI 重新解析依赖。
          uv cache clean || true
          rm -f uv.lock
          uv sync --no-cache --index-url https://pypi.org/simple || (sleep 10 && uv sync --no-cache --index-url https://pypi.org/simple)

      - name: Show schedule status
        run: uv run python -m trendradar --show-schedule

      - name: Run TrendRadar
        run: uv run python -m trendradar

      - name: Persist output cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update trendradar output cache [skip ci]"
            git pull --rebase --autostash || true
            git push || true
          else
            echo "No output cache changes to commit."
          fi
