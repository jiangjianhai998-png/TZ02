name: TZ02 TrendRadar

on:
  workflow_dispatch:
  schedule:
    # 每 20 分钟运行一次。GitHub Actions 使用 UTC 时间。
    - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: tz02-trendradar
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TZ: Asia/Singapore
      TIMEZONE: Asia/Singapore
      GITHUB_ACTIONS: "true"
      AI_MODEL: deepseek/deepseek-chat
      AI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.AI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.AI_API_KEY }}
      AI_API_BASE: https://api.deepseek.com
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || format('{0};{1}', secrets.TELEGRAM_GROUP_CHAT_ID, secrets.TELEGRAM_CHANNEL_CHAT_ID) }}
      STORAGE_RETENTION_DAYS: "3"
      AI_TIMEOUT: "180"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Show schedule status
        run: uv run python -m trendradar --show-schedule

      - name: Run TrendRadar
        run: uv run python -m trendradar

      - name: Persist output cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update trendradar output cache [skip ci]"
            git pull --rebase --autostash || true
            git push || true
          else
            echo "No output cache changes to commit."
          fi
