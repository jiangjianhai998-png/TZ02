name: Telegram Interactions

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 最小建议间隔约 5 分钟；脚本内部会长轮询，让按钮尽量接近实时响应。
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: tz02-telegram-interactions
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TZ: Asia/Singapore
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_INTERACTION_STATE: data/telegram_interactions_state.json
      TELEGRAM_INTERACTION_POLL_SECONDS: "260"
      TELEGRAM_INTERACTION_POLL_TIMEOUT: "20"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Handle Telegram likes and comments
        run: python -m trendradar.notification.telegram_interactions

      - name: Persist Telegram interaction state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram_interactions_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update telegram interaction state [skip ci]"
            git pull --rebase --autostash || true
            git push || true
          else
            echo "No Telegram interaction state changes to commit."
          fi
